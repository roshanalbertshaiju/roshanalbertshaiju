<svg width="1600" height="300" viewBox="0 0 1600 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<filter id="glitch">

  <feTurbulence
    type="fractalNoise"
    baseFrequency="0.015 0.08"
    numOctaves="1"
    seed="7"
    result="noise"/>

  <feDisplacementMap
    in="SourceGraphic"
    in2="noise"
    scale="5"
    xChannelSelector="R"
    yChannelSelector="G"/>

</filter>

<filter id="softglitch">

  <feTurbulence
    type="fractalNoise"
    baseFrequency="0.008 0.04"
    numOctaves="1"
    seed="3"
    result="noise"/>

  <feDisplacementMap
    in="SourceGraphic"
    in2="noise"
    scale="2"/>

</filter>

<pattern
  id="scanlines"
  width="6"
  height="6"
  patternUnits="userSpaceOnUse">

  <rect width="6" height="3" fill="white" opacity="0.035"/>

</pattern>

<clipPath id="nameClip">
  <text
    x="800"
    y="205"
    text-anchor="middle"
    font-family="Arial Black, Helvetica, sans-serif"
    font-size="142"
    font-weight="900"
    letter-spacing="3">
    ROSHAN ALBERT SHAIJU
  </text>
</clipPath>
```

  </defs>

  <!-- RGB OFFSET LAYERS -->

<g
 font-family="Arial Black, Helvetica, sans-serif"
 font-size="142"
 font-weight="900"
 letter-spacing="3"
 text-anchor="middle">

```
<!-- red ghost -->

<text
  x="794"
  y="205"
  fill="#ff003c"
  opacity="0.65"
  filter="url(#softglitch)">

  ROSHAN ALBERT SHAIJU

  <animate
    attributeName="x"
    values="794;799;791;797;794"
    dur="3.2s"
    repeatCount="indefinite"/>

  <animate
    attributeName="y"
    values="205;201;208;203;205"
    dur="2.7s"
    repeatCount="indefinite"/>

</text>


<!-- blue ghost -->

<text
  x="806"
  y="205"
  fill="#00e5ff"
  opacity="0.65"
  filter="url(#softglitch)">

  ROSHAN ALBERT SHAIJU

  <animate
    attributeName="x"
    values="806;801;809;803;806"
    dur="2.9s"
    repeatCount="indefinite"/>

  <animate
    attributeName="y"
    values="205;209;202;207;205"
    dur="3.1s"
    repeatCount="indefinite"/>

</text>


<!-- MAIN TEXT -->

<text
  x="800"
  y="205"
  fill="#ffffff"
  stroke="#ffffff"
  stroke-width="1"
  filter="url(#glitch)">

  ROSHAN ALBERT SHAIJU

  <!-- subtle horizontal movement -->

  <animate
    attributeName="x"
    values="800;802;798;801;800"
    dur="4.5s"
    repeatCount="indefinite"/>

</text>
```

  </g>

  <!-- RANDOM GLITCH BARS -->

  <g opacity="0.75">

```
<rect x="100" y="85" width="230" height="3" fill="#ff003c">
  <animate
    attributeName="x"
    values="100;180;70;250;100"
    dur="2.1s"
    repeatCount="indefinite"/>
</rect>

<rect x="1150" y="125" width="310" height="3" fill="#00e5ff">
  <animate
    attributeName="x"
    values="1150;1220;1110;1180;1150"
    dur="2.7s"
    repeatCount="indefinite"/>
</rect>

<rect x="420" y="225" width="170" height="2" fill="#ffffff">
  <animate
    attributeName="x"
    values="420;510;390;470;420"
    dur="1.8s"
    repeatCount="indefinite"/>
</rect>
```

  </g>

  <!-- SCANLINE OVERLAY -->

<rect
 x="0"
 y="0"
 width="1600"
 height="300"
 fill="url(#scanlines)"/>

  <!-- OCCASIONAL DISTORTION -->

<g
 clip-path="url(#nameClip)"
 opacity="0.7">

```
<rect
  x="0"
  y="110"
  width="1600"
  height="8"
  fill="#00e5ff">

  <animate
    attributeName="y"
    values="110;180;145;225;110"
    dur="4s"
    repeatCount="indefinite"/>

  <animate
    attributeName="height"
    values="8;3;15;5;8"
    dur="4s"
    repeatCount="indefinite"/>

</rect>

<rect
  x="0"
  y="190"
  width="1600"
  height="5"
  fill="#ff003c">

  <animate
    attributeName="y"
    values="190;140;215;165;190"
    dur="3.4s"
    repeatCount="indefinite"/>

</rect>
```

  </g>

</svg>
